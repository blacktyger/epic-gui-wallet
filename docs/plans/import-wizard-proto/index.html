<!doctype html>
<html lang="en" data-ui="modern" data-theme="dark" data-w="1280">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import wizard prototype</title>
<style>
/* Tokens copied from src/assets/css/modern/_tokens.scss (BT Labs Theme). */
html[data-ui='modern'] {
  color-scheme: dark;

  /* Elevation: four steps, lighter as it lifts. */
  --bg: #08080a;          /* window */
  --s1: #0d0d10;          /* sidebar, panels, lists */
  --s2: #131318;          /* fields, segmented controls */
  --s3: #1a1a21;          /* hover, selected row, pressed */
  --s4: #22222b;          /* dialogs, popovers */

  --line: #24242a;        /* hairlines between rows */
  --line-strong: #33333d; /* enclosures: panels, dialogs */
  --line-field: #62626d;  /* desktop: field and checkbox edges, 3.3:1 on --bg (WCAG 1.4.11) */

  --text: #fff9f9;        /* warm off-white, epiccash.com body text */
  --dim: #a4a4ad;         /* secondary, 7.0:1 on --s3 */
  --faint: #8a8a94;       /* desktop: was #70707a (4.1:1). Now 5.1:1 on --s3, 4.6:1 on dialogs (--s4) */

  --accent: #f6d471;      /* gold: primary fill, focus, current position */
  --accent-deep: #c98a3e; /* corner ticks, the far end of the brand gradient */
  --accent-ink: #08080a;  /* text on gold, 13.9:1 */
  --accent-text: #f6d471; /* gold as text */
  --accent-soft: rgba(246, 212, 113, 0.14);
  --accent-faint: rgba(246, 212, 113, 0.06);
  --tick: #c98a3e;

  --ok: #8ad98a;
  --ok-soft: rgba(138, 217, 138, 0.12);
  --warn: #f0c274;
  --warn-soft: rgba(240, 194, 116, 0.12);
  --risk: #f08a8a;
  --risk-soft: rgba(240, 138, 138, 0.12);

  --hover: rgba(255, 249, 249, 0.05);
  --press: rgba(255, 249, 249, 0.09);
  --grid: rgba(255, 249, 249, 0.035);
  --scrim: rgba(5, 5, 6, 0.72);
  --selection: rgba(246, 212, 113, 0.28);
  --glow: rgba(246, 212, 113, 0.32);
  --shadow-pop: 0 12px 32px -8px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
}

html[data-ui='modern'][data-theme='light'] {
  color-scheme: light;

  /* Light goes darker as it lifts. */
  --bg: #f7f7f8;
  --s1: #ffffff;
  --s2: #ffffff;
  --s3: #eeeef0;
  --s4: #ffffff;

  --line: #e0e0e4;
  --line-strong: #c9c9d0;
  --line-field: #868690; /* 3.4:1 on --bg */

  --text: #1c1e21;
  --dim: #55555f;
  --faint: #6b6b75; /* desktop: was #767680 (3.9:1 on --s3). Now 4.6:1 */

  /* Gold becomes the devhub's AA brown, fill and text alike. Ticks turn charcoal. */
  --accent: #8f5e1f;
  --accent-deep: #8f5e1f;
  --accent-ink: #ffffff; /* 5.5:1 */
  --accent-text: #815525; /* the devhub's primary-dark: 4.8:1 even on a gold tint over --s3 */
  --accent-soft: rgba(143, 94, 31, 0.12);
  --accent-faint: rgba(143, 94, 31, 0.05);
  --tick: #1c1e21;

  --ok: #1f7a3a;
  --ok-soft: rgba(31, 122, 58, 0.1);
  --warn: #815525;
  --warn-soft: rgba(143, 94, 31, 0.1);
  --risk: #b3261e;
  --risk-soft: rgba(179, 38, 30, 0.08);

  --hover: rgba(0, 0, 0, 0.04);
  --press: rgba(0, 0, 0, 0.07);
  --grid: rgba(28, 30, 33, 0.05);
  --scrim: rgba(28, 30, 33, 0.4);
  --selection: rgba(143, 94, 31, 0.2);
  --glow: rgba(143, 94, 31, 0.16);
  --shadow-pop: 0 12px 32px -8px rgba(28, 30, 33, 0.22), 0 2px 6px rgba(28, 30, 33, 0.08);
}

html[data-ui='modern'] {
  /* Type. Montserrat for display only (balance, titles, section heads); the platform face for
   * everything a person reads or clicks; JetBrains Mono for data: amounts in lists, addresses,
   * slate IDs, heights, commitments. Its slashed zero and distinct l/1/I matter when someone
   * checks a 52-character Epicbox address. */
  --font-display: 'Montserrat', system-ui, sans-serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', 'Ubuntu', 'Cantarell', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  /* Fixed scale for a product UI, about 1.2 per step. 14 px is the body size. */
  --fs-xs: 0.75rem;     /* 12: captions, timestamps */
  --fs-sm: 0.8125rem;   /* 13: secondary, table meta */
  --fs-md: 0.875rem;    /* 14: body, controls */
  --fs-lg: 1rem;        /* 16: field values that matter, lead text */
  --fs-h3: 1.125rem;    /* 18: section heads */
  --fs-h2: 1.375rem;    /* 22: page titles */
  --fs-h1: 1.75rem;     /* 28: unlock, onboarding */
  --fs-display: 2.75rem;/* 44: the balance */
  --track-display: -0.022em;

  /* Space, 4 px base. */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* Radii: 4 tags, 8 controls and panels, 14 dialogs. */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-lg: 14px;

  /* desktop: controls are 44 high (Wallet for Epic: 48), one size for buttons and fields. */
  --ctl: 44px;
  --ctl-sm: 36px;

  --sidebar: 224px;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 120ms;
  --dur: 200ms;
  --dur-slow: 320ms;
}


@font-face { font-family: 'Montserrat'; font-weight: 100 900; font-display: swap; src: url('montserrat-latin.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: swap; src: url('JetBrainsMono-Regular.ttf') format('truetype'); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: var(--fs-md)/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); } .faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.grow { flex: 1; min-width: 0; }
.e-icon { width: 20px; height: 20px; flex: none; fill: currentColor; }
.e-icon.sm { width: 16px; height: 16px; }
.e-icon.lg { width: 24px; height: 24px; }

/* ===== buttons (tiers as in _base.scss) ===== */
.e-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); height: var(--ctl); padding: 0 var(--sp-5); border-radius: var(--r-sm);
  border: 1px solid var(--line-field); background: var(--s2); color: var(--text); font-weight: 600; font-size: var(--fs-md); text-decoration: none; white-space: nowrap; }
.e-btn:hover:not(:disabled) { background: var(--s3); border-color: var(--dim); }
.e-btn .e-icon { width: 18px; height: 18px; color: var(--dim); }
.e-btn-sm { height: var(--ctl-sm); padding: 0 var(--sp-3); font-size: var(--fs-sm); }
.e-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.e-btn-primary .e-icon { color: inherit; }
.e-btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--text)); border-color: transparent; }
.e-btn-primary:disabled { background: var(--s3); border-color: var(--line-strong); color: var(--faint); cursor: not-allowed; }
.e-btn-ghost { background: transparent; border-color: transparent; color: var(--dim); }
.e-btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: transparent; }
.e-btn-danger { background: transparent; border-color: var(--risk); color: var(--risk); }
.e-btn-danger:hover:not(:disabled) { background: var(--risk-soft); border-color: var(--risk); }
.e-btn-danger-fill { background: var(--risk); border-color: var(--risk); color: #08080a; }
[data-theme='light'] .e-btn-danger-fill { color: #fff; }
.e-btn:disabled { background: transparent; border-color: var(--line); border-style: dashed; color: var(--faint); cursor: not-allowed; }
.e-btn-lg { height: 52px; padding: 0 var(--sp-8); font-size: var(--fs-lg); }
.e-btn-inline { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; height: 24px; padding: 0 6px; margin: 0 -2px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--accent-text); font-size: var(--fs-sm); font-weight: 600; line-height: 1; white-space: nowrap; text-decoration: none; }
.e-btn-inline:hover { background: var(--hover); }
.e-btn-inline .e-icon { width: 14px; height: 14px; }
.e-btn-inline.risk { color: var(--risk); }
.e-link { color: var(--accent-text); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

/* ===== tags, notices, progress ===== */
.e-tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-xs); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; border: 1px solid var(--line-strong); color: var(--dim); }
.e-tag .e-icon { width: 14px; height: 14px; }
.e-tag.e-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-soft); }
.e-tag.e-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.e-tag.e-risk { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 45%, transparent); background: var(--risk-soft); }
.e-tag.e-gold { color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.e-notice { display: grid; grid-template-columns: 20px 1fr auto; gap: var(--sp-3); align-items: start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--s1); }
.e-notice > .e-icon { margin-top: 1px; color: var(--dim); }
.e-notice b { font-weight: 600; }
.e-notice p { color: var(--dim); font-size: var(--fs-sm); margin-top: 2px; }
.e-notice .acts { align-self: center; display: flex; gap: var(--sp-2); }
.e-notice.e-warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.e-notice.e-warn > .e-icon { color: var(--warn); }
.e-notice.e-risk { border-color: color-mix(in srgb, var(--risk) 40%, transparent); background: var(--risk-soft); }
.e-notice.e-risk > .e-icon { color: var(--risk); }
.e-notice.e-ok > .e-icon { color: var(--ok); }
.e-notice.e-gold { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-faint); }
.e-notice.e-gold > .e-icon { color: var(--accent-text); }
.e-progress { height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.e-progress > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.e-progress.ok > i { background: var(--ok); }
.e-progress.indet > i { width: 30%; animation: indet 1.4s var(--ease) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.e-spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
.e-spinner.big { width: 40px; height: 40px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok-t { color: var(--ok); } .risk-t { color: var(--risk); } .warn-t { color: var(--warn); }
.e-small { font-size: var(--fs-sm); }
.e-help { font-size: var(--fs-sm); color: var(--dim); }

/* checkbox */
.e-check { appearance: none; width: 20px; height: 20px; flex: none; margin: 0; border: 1.5px solid var(--line-field); border-radius: 5px; background: var(--s2); display: inline-grid; place-items: center; cursor: pointer; }
.e-check:checked { background: var(--accent); border-color: var(--accent); }
.e-check:checked::after { content: ''; width: 5px; height: 10px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.e-check:disabled { border-style: dashed; border-color: var(--line-strong); background: transparent; cursor: not-allowed; }

/* ===== app shell (main window) ===== */
.app { flex: 1; display: flex; min-height: 0; }
.side { width: var(--sidebar); flex: none; background: var(--s1); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
[data-w='1044'] .side { width: 200px; }
.brand { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-5) var(--sp-4); font: 700 var(--fs-md) var(--font-display); letter-spacing: .04em; }
.brand svg { width: 18px; height: 21px; color: var(--accent); }
.nav { padding: 0 var(--sp-2); display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: var(--sp-3); height: 40px; padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--dim); text-decoration: none; }
.nav a[aria-current] { background: var(--s3); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.nav a[aria-current] .e-icon { color: var(--accent-text); }
.nav-sep { height: 1px; background: var(--line); margin: var(--sp-2) var(--sp-3); }
.side-foot { margin-top: auto; padding: var(--sp-3); border-top: 1px solid var(--line); display: flex; align-items: center; gap: var(--sp-2); }
.avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font: 700 var(--fs-xs) var(--font-display); }
.side-foot b { display: block; font-size: var(--fs-sm); } .side-foot small { color: var(--faint); font-size: var(--fs-xs); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 64px; flex: none; display: flex; align-items: center; padding: 0 var(--sp-8); border-bottom: 1px solid var(--line); }
.topbar h1 { font: 600 var(--fs-h2) var(--font-display); }
.content { flex: 1; min-height: 0; padding: var(--sp-6) var(--sp-8); overflow: hidden; }
.panel { background: var(--s1); border: 1px solid var(--line-strong); border-radius: var(--r-sm); }

/* dashboard (behind dialogs) */
.bal { padding: var(--sp-6); margin-bottom: var(--sp-6); }
.bal small { color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-size: var(--fs-xs); }
.bal .big { font: 600 var(--fs-display) var(--font-display); letter-spacing: var(--track-display); margin: var(--sp-2) 0; }
.bal .big span { font-size: var(--fs-h3); color: var(--dim); margin-left: var(--sp-2); }
.h3 { font: 600 var(--fs-h3) var(--font-display); margin: 0 0 var(--sp-3); }
.tx { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.tx:first-child { border-top: 0; }
.tx .in { color: var(--ok); font-family: var(--font-mono); }
.chips { margin-left: auto; display: flex; gap: var(--sp-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--sp-3); border-radius: 14px; border: 1px solid var(--line-strong); font-size: var(--fs-xs); color: var(--dim); background: var(--s1); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* settings */
.stg { display: grid; grid-template-columns: 192px minmax(0, 1fr); gap: var(--sp-8); align-items: start; }
[data-w='1280'] .stg { grid-template-columns: 208px minmax(0, 760px); }
.stg-nav { display: flex; flex-direction: column; gap: 2px; }
.stg-nav a { display: flex; align-items: center; gap: var(--sp-3); height: 38px; padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--dim); text-decoration: none; font-size: var(--fs-md); }
.stg-nav a .e-icon { width: 18px; height: 18px; }
.stg-nav a[aria-current] { background: var(--s3); color: var(--text); }
.stg-nav a[aria-current] .e-icon { color: var(--accent-text); }
.stg-sep { height: 1px; background: var(--line); margin: var(--sp-2) var(--sp-3); }
.set-group { margin-bottom: var(--sp-6); }
.set-group > h2 { font: 600 var(--fs-h3) var(--font-display); margin-bottom: var(--sp-3); }
.set-card { background: var(--s1); border: 1px solid var(--line-strong); border-radius: var(--r-sm); }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-3) var(--sp-6); align-items: center; padding: var(--sp-4); }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row b { display: block; font-weight: 600; }
.set-row p { color: var(--dim); font-size: var(--fs-sm); margin-top: 2px; max-width: 52ch; }
.set-row .path { font-family: var(--font-mono); font-size: 0.78rem; color: var(--dim); overflow-wrap: anywhere; margin-top: 4px; }
.set-row .val { color: var(--text); font-size: var(--fs-md); }
.set-row .ctl { display: flex; gap: var(--sp-1); align-items: center; }

/* ===== hero (Welcome, Unlock) ===== */
.hero { flex: 1; display: grid; place-items: center; padding: var(--sp-8); position: relative; overflow: hidden;
  background: radial-gradient(60% 50% at 50% 0%, var(--accent-faint), transparent 70%), var(--bg); }
.hero::before { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; mask-image: radial-gradient(70% 60% at 50% 20%, #000 0%, transparent 80%); }
.hero > * { position: relative; }
.hero-in { width: 420px; display: flex; flex-direction: column; align-items: stretch; text-align: center; }
.tile { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--s1); box-shadow: 0 0 36px -8px var(--glow); position: relative; }
.tile svg { width: 32px; height: 37px; color: var(--accent); }
.tile.sm { width: 36px; height: 36px; box-shadow: 0 0 18px -6px var(--glow); }
.tile.sm svg { width: 16px; height: 19px; }
.tick { position: absolute; width: 10px; height: 10px; border: 0 solid var(--tick); }
.tick.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; } .tick.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
.tick.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; } .tick.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
.hero h1 { font: 600 var(--fs-h1) var(--font-display); letter-spacing: -0.01em; margin-top: var(--sp-5); }
.hero .lead { color: var(--dim); font-size: var(--fs-lg); margin-top: var(--sp-2); }
.opts { display: flex; flex-direction: column; gap: var(--sp-2); text-align: left; margin-top: var(--sp-6); }
.opt { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--s1); color: var(--text); text-decoration: none; min-width: 0; width: 100%; text-align: left; }
.opt:hover { background: var(--s3); }
.opt.primary { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-faint); }
.opt > .e-icon { color: var(--accent-text); }
.opt .t { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.opt .t b { font-weight: 600; } .opt .t span { font-size: var(--fs-sm); color: var(--dim); }
.opt .go { color: var(--faint); width: 16px; height: 16px; }
.opt-note { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--dim); padding: 0 var(--sp-4) 0 calc(var(--sp-4) + 20px + var(--sp-3)); margin-top: var(--sp-2); }
.opt-note .e-icon { width: 14px; height: 14px; color: var(--ok); }
.adv { margin-top: var(--sp-6); text-align: left; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--s1); }
.adv summary { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); color: var(--dim); font-size: var(--fs-sm); cursor: pointer; list-style: none; }
.adv summary::-webkit-details-marker { display: none; }
.adv summary .e-icon { width: 14px; height: 14px; }
.adv[open] summary .e-icon { transform: rotate(90deg); }
.hero-foot { position: absolute !important; bottom: var(--sp-5); left: 0; right: 0; text-align: center; color: var(--faint); font-size: var(--fs-xs); }
.fieldwrap label { display: block; font-size: var(--fs-sm); color: var(--dim); margin-bottom: var(--sp-1); text-align: left; }
.input { width: 100%; height: var(--ctl); padding: 0 var(--sp-3); border-radius: var(--r-sm); border: 1px solid var(--line-field); background: var(--s2); color: var(--text); }

/* ===== the Demo panel: deliberately not the app's look ===== */
#demo { position: fixed; z-index: 100; right: 16px; top: 16px; width: 276px; max-height: calc(100vh - 32px); overflow: auto; background: #16181f; color: #e8e9ee;
  border: 1.5px dashed #7ab8ff; border-radius: 10px; font: 12.5px/1.4 ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
#demo * { font: inherit; }
#demo header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; position: sticky; top: 0; background: #16181f; border-bottom: 1px dashed #3a4050; }
#demo header b { letter-spacing: .12em; color: #7ab8ff; } #demo header span { color: #8c92a3; flex: 1; font-size: 11px; }
#demo button { cursor: pointer; }
#demo .tg { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #3a4050; background: #1f222b; color: #e8e9ee; }
#demo .body { padding: 6px 10px 12px; } #demo[data-open='false'] .body { display: none; }
#demo[data-open='false'] { width: auto; }
#demo[data-open='false'] header span { display: none; }
#demo h4 { margin: 12px 0 6px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #8c92a3; font-weight: 600; }
#demo .seg { display: flex; border: 1px solid #3a4050; border-radius: 6px; overflow: hidden; }
#demo .seg button { flex: 1; padding: 6px 4px; border: 0; background: #1f222b; color: #c4c8d4; border-right: 1px solid #3a4050; }
#demo .seg button:last-child { border-right: 0; } #demo .seg button[aria-pressed='true'] { background: #2b4a73; color: #fff; }
#demo label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
#demo label small { display: block; color: #8c92a3; font-size: 11px; }
#demo input[type=checkbox] { margin: 2px 0 0; accent-color: #7ab8ff; width: 15px; height: 15px; flex: none; }
#demo .row2 { display: flex; gap: 6px; margin-top: 8px; }
#demo .row2 button { flex: 1; padding: 7px 4px; border: 1px solid #3a4050; border-radius: 6px; background: #1f222b; color: #e8e9ee; }
#demo button:hover { filter: brightness(1.25); }
#demo :focus-visible { outline: 2px solid #7ab8ff; outline-offset: 1px; }

#demo .note { color: #8c92a3; display: block; margin-top: 4px; font-size: 11px; }

</style>

const STEPNAME = { find: 'Find', choose: 'Choose', check: 'Check', copy: 'Copy and verify', settings: 'Bring over', done: 'Done' };

}
function footFor(k) {
  const sel = W.found ? selected() : [];
  const back = W.i > 0 && !W.adoptedIds.length && k !== 'done' && !(W.mode === 'move' && k === 'check');
  switch (k) {
    case 'find': return { back: false, label: 'Continue', off: W.scan !== 'done' || !W.found.length };
    case 'choose': return { back, label: 'Continue', off: !sel.length, stat: `${sel.length} of ${W.found.length} selected` };
    case 'check': {
      const busy = sel.some((f) => !W.lock[f.id] || W.lock[f.id] === 'checking');
      const pend = sel.some((f) => W.lock[f.id] === 'locked');
      const ok = sel.some((f) => W.lock[f.id] === 'free');
      return { back, label: 'Continue', off: busy || pend || !ok, stat: busy ? 'Checking…' : pend ? 'Close the other program, or skip that wallet' : '' };
    }
    case 'copy': {
      const c = sel.filter((f) => W.lock[f.id] === 'free');
      const ok = c.filter((f) => W.copy[f.id] && W.copy[f.id].st === 'ok').length;
      const open = c.some((f) => { const s = W.copy[f.id] && W.copy[f.id].st; return !s || s === 'wait' || s === 'run' || s === 'fail'; });
      return { back, label: 'Continue', off: open || !ok || W.spaceErr, stat: `${ok} of ${c.length} copied and checked` };

    case 'settings': return { back: false, label: 'Bring over', off: !!W.busy };

async function checkLock(id) {
  const w = W; w.tok = w.tok || {}; const t = (w.tok[id] = (w.tok[id] || 0) + 1);
  w.lock[id] = 'checking'; render(); await sleep(800);
  if (W !== w || w.tok[id] !== t || w.lock[id] !== 'checking') return;
  w.lock[id] = lockResult(w.found.find((f) => f.id === id)); render();
}
function advance() {
  const k = stepKey();
  if (k === 'done') { closeWizard(); return; }
  if (k === 'settings') { finishSettings(); return; }
  if (k === 'copy') adopt();
  go(1);
}
function adopt() {
  const sel = selected().filter((f) => W.copy[f.id] && W.copy[f.id].st === 'ok');
  if (W.mode === 'move') {
    const w = wal(sel[0].id); const from = w.dir;
    w.move = { state: 'pending', from, old: '', ref: { total: w.bal, outputs: 41, txs: 86, addr: 'epic1q…x7km' } };
    w.place = 'own'; w.dir = `${ROOT}/wallets/${w.id}`; W.adoptedIds = [w.id]; W.doneIds = [w.id]; return;
  }
  sel.forEach((f) => {
    const id = 'w' + nextId++;
    S.wallets.push({ id, label: f.label, net: f.net, place: 'own', dir: `${ROOT}/wallets/${id}`, seed: f.seed, bal: f.bal, size: f.size, chain: f.chain || 0, move: { state: 'pending', from: f.dir, old: '', ref: null }, offered: true });
    W.adoptedIds.push(id);
  });
  W.doneIds = W.adoptedIds.slice();
}
async function finishSettings() {
  const run = ++W.run;
  if (W.set.chain) {
    const total = (W.found.find((f) => f.chain) || { chain: 8100 }).chain;
    W.busy = { label: 'Copying the blockchain data…', pct: 0, detail: '' }; render();
    for (let p = 0; p <= 100; p += 4) { if (!alive(run)) return; W.busy.pct = p; W.busy.detail = `${(total * p / 100 / 1000).toFixed(1)} of ${(total / 1000).toFixed(1)} GB`; paintBusy(); await sleep(70); }
    W.chainDone = true;
  }
  if (!alive(run)) return;
  go(1);
}
function paintBusy() { const b = $('.cd[role=status]'); if (!b || !W.busy) return; b.querySelector('i').style.width = W.busy.pct + '%'; b.querySelector('p').textContent = W.busy.detail; }

/* copy and verify, one wallet at a time */
const FILES = ['wallet_data/wallet.seed', 'wallet_data/db/sqlite/epic.db', 'wallet_data/db/sqlite/epic.db-wal', 'wallet_data/saved_txs/slate_01.json', 'wallet_data/saved_txs/slate_02.json', 'wallet_tor/onion_service_addresses/hs_ed25519_secret_key'];
const hex = (n) => [...Array(n)].map(() => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
const resumeCopy = () => { if (W && stepKey() === 'copy') startCopy(); };
async function startCopy() {
  const run = ++W.run;
  const list = selected().filter((f) => W.lock[f.id] === 'free');
  const todo = list.filter((f) => { const s = W.copy[f.id] && W.copy[f.id].st; return !s || s === 'wait' || s === 'run' || s === 'fail'; });
  todo.forEach((f) => { W.copy[f.id] = { st: 'wait' }; });
  W.spaceErr = false;
  if (todo.length && S.flags.space) { S.flags.space = false; W.spaceErr = true; renderDemo(); render(); return; }
  render();
  const failAt = S.flags.mismatch ? (list[1] || list[0]).id : null;
  const phases = [['Reading the old folder', 500], ['Copying', 900], ['Checking the copy', 900], ['Checking the old folder', 450]];
  for (const f of todo) {
    if (!alive(run)) return;
    const c = W.copy[f.id] = { st: 'run', ph: 0, pct: 0, files: 18 + Math.round(f.size / 4), file: '', label: 'Starting…', hash: hex(16) };
    render();
    for (let p = 0; p < 4; p++) {
      for (let s = 0; s < 6; s++) {
        if (!alive(run)) return;
        c.ph = p; c.pct = Math.round(((p + s / 6) / 4) * 100); c.label = phases[p][0] + '…';
        c.file = p === 0 ? FILES[s % FILES.length].split('/')[0] + '/' : FILES[s % FILES.length];
        c.hashLive = p === 2 ? 'sha256 ' + hex(8) + '…' + hex(4) : '';
        if (p === 3 && failAt === f.id && s === 3) { S.flags.mismatch = false; renderDemo(); c.st = 'fail'; render(); return; }
        if (s === 0) render(); else paintCopy(f.id, c);
        await sleep(phases[p][1] / 6);
      }
    }
    c.st = 'ok'; c.ph = 4; render();
  }
}
function paintCopy(id, c) {
  const q = (k) => $(`[data-live="${k}-${id}"]`);
  if (q('f')) q('f').textContent = c.file;
  if (q('h')) q('h').textContent = c.hashLive;
  if (q('b')) q('b').style.width = c.pct + '%';
  if (q('t')) q('t').textContent = c.label;
}

/* ---------- unlock + test open ---------- */
async function unlockNow() {
  const w = wal(S.cur);
  if (!S.pw) { S.unlockErr = 'Type your password.'; focusReq = 'upw'; render(); return; }
  S.unlockErr = '';
  if (!(w.move && w.move.state === 'pending')) { enterHome(w); return; }
  openDlg({ type: 'testopen', id: w.id, step: 0 }, 'upw');
  for (let i = 1; i <= 4; i++) { await sleep(620); if (!DLG || DLG.type !== 'testopen') return; DLG.step = i; render(); }
  await sleep(250);
  if (S.flags.openFail) { S.flags.openFail = false; renderDemo(); openDlg({ type: 'openfail', id: w.id }, 'upw'); return; }
  const other = S.wallets.find((x) => x.id !== w.id && x.seed === w.seed && !x.dupAck && x.place === 'own' && (!x.move || x.move.state === 'verified'));
  const inPlace = S.wallets.find((x) => x.id !== w.id && x.seed === w.seed && x.place === 'inplace');
  if (other || inPlace) { openDlg({ type: 'dup', id: w.id, other: (other || inPlace).id }, 'upw'); return; }
  passOpen(w);
}
function passOpen(w) {
  w.move.state = 'verified'; DLG = null; S.view = 'home'; S.page = 'home'; S.cur = w.id; S.pw = '';
  if (w.move.ref) { DLG = { type: 'moveok', id: w.id, ret: '', fresh: true }; focusReq = 'dlg'; render(); }
  else { focusReq = null; render(); toast(`Moved from ${w.move.from}: ${w.bal} EPIC before refresh.`); }
}
function enterHome(w) {
  S.view = 'home'; S.page = 'home'; S.pw = ''; focusReq = null; render();
  if (w.place === 'inplace' && !w.offered) { w.offered = true; setTimeout(() => { if (S.view === 'home' && !W && !DLG) openDlg({ type: 'moveoffer', id: w.id }, ''); }, RM ? 20 : 600); }
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('#frame [data-act]'); if (!t || t.disabled) return;
  const a = A[t.dataset.act]; if (a) a(t.dataset.arg);
});
document.addEventListener('dblclick', (e) => { const t = e.target.closest('#frame [data-act="pkSel"]'); if (t) A.pkOpen(t.dataset.arg); });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.chg === 'cur') { S.cur = t.value; S.unlockErr = ''; render(); return; }
  if (!t.dataset.chk) return;
  const [k, id] = t.dataset.chk.split(':');
  if (k === 'sel') W.sel[id] = t.checked; else if (k === 'set') W.set[id] = t.checked; else if (k === 'delchain') DLG.chain = t.checked;
  render();
});
document.addEventListener('input', (e) => { if (e.target.dataset.inp === 'pw') { S.pw = e.target.value; S.unlockErr = ''; const er = $('#uerr'); if (er) er.remove(); } });
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.dataset.form === 'unlock') unlockNow(); });
document.addEventListener('keydown', (e) => {
  const inDemo = e.target.closest && e.target.closest('#demo');
  if (e.key === 'Escape' && !inDemo) {
    if (DLG) { if (!['testopen', 'prep'].includes(DLG.type)) closeDlg(); e.preventDefault(); }
    else if (W && !W.busy) { A.cancel(); e.preventDefault(); }
  }
  if (e.key === 'Enter' && !inDemo && !e.defaultPrevented) {
    const t = e.target;
    if (t.matches && t.matches('button,a,input,select,summary,textarea')) return;
    const p = topLayer().querySelector('[data-primary]:not(:disabled)'); if (p) { p.click(); e.preventDefault(); }
  }
  if (e.key === 'Tab' && !inDemo) {
    const layer = topLayer(); const els = [...layer.querySelectorAll(FOCUSABLE)].filter((x) => x.offsetParent !== null);
    if (!els.length) return;
    if (!layer.contains(document.activeElement)) { els[0].focus(); e.preventDefault(); return; }
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});

/* ---------- demo panel and fit ---------- */
function renderDemo() {
  const seg = (name, v, items) => `<div class="seg" role="group" aria-label="${name}">${items.map(([k, t]) => `<button data-d="${name}:${k}" aria-pressed="${v === k}">${t}</button>`).join('')}</div>`;
  const flag = (k, t, s) => `<label><input type="checkbox" data-d="flag:${k}" ${S.flags[k] ? 'checked' : ''}><span>${t}<small>${s}</small></span></label>`;
  const p = $('#demo'); p.dataset.open = S.demoOpen;
  const focused = document.activeElement && p.contains(document.activeElement) ? document.activeElement.dataset.d : null;
  p.innerHTML = `<header><b>DEMO</b><span>not part of the app</span><button class="tg" data-d="toggle" aria-expanded="${S.demoOpen}" aria-label="${S.demoOpen ? 'Collapse' : 'Expand'} demo panel">${S.demoOpen ? '–' : '+'}</button></header>
  <div class="body"><h4>Start as</h4>${seg('mode', S.mode, [['first', 'First run'], ['existing', '6.1 user']])}
  <small class="note">6.1 user: a wallet used in place, for the Move offer</small>
  <h4>Old wallets found</h4>${seg('scan', S.scan, [['several', 'Several'], ['one', 'One'], ['none', 'None']])}
  <h4>Problems</h4>${flag('locked', 'In use by another program', 'Check step. Stays on until you untick it.')}${flag('space', 'Not enough disk space', 'Copy step. Fires once.')}${flag('mismatch', 'Copy mismatch, rollback', 'Copy step, 2nd wallet. Fires once.')}${flag('openFail', 'Test open fails', 'First unlock of a copied wallet. Fires once.')}${flag('dupe', 'Same wallet twice', 'Adds a duplicate to the list.')}
  <h4>Window</h4>${seg('theme', S.theme, [['dark', 'Dark'], ['light', 'Light']])}<div style="height:6px"></div>${seg('w', String(S.w), [['1280', '1280'], ['1044', '1044']])}
  <div class="row2"><button data-d="restart">Restart demo</button></div></div>`;
  if (focused) { const el = p.querySelector(`[data-d="${focused}"]`); if (el) el.focus(); }
  fit();
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('#demo button[data-d]'); if (!b) return;
  const [k, v] = b.dataset.d.split(':');
  if (k === 'toggle') S.demoOpen = !S.demoOpen;
  else if (k === 'mode') { S.mode = v; reset(); }
  else if (k === 'scan') { S.scan = v; if (!W) render(); else toast('The new setting applies to the next search.'); }
  else if (k === 'theme') { S.theme = v; document.documentElement.dataset.theme = v; }
  else if (k === 'w') { S.w = +v; document.documentElement.dataset.w = v; }
  else if (k === 'restart') reset();
  renderDemo();
});
document.addEventListener('change', (e) => {
  const c = e.target.closest('#demo input[data-d^="flag:"]'); if (!c) return;
  S.flags[c.dataset.d.slice(5)] = c.checked;
  if (c.dataset.d === 'flag:dupe' && !W) render();
});
function fit() {
  const open = $('#demo').dataset.open === 'true' && innerWidth > 900;
  const aw = innerWidth - (open ? 296 : 0) - 24, ah = innerHeight - 24;
  const s = Math.min(1, aw / S.w, ah / 780);
  const hold = $('#hold'); hold.style.width = S.w * s + 'px'; hold.style.height = 780 * s + 'px';
  $('#frame').style.transform = `scale(${s})`;
  $('#stage').style.paddingRight = open ? '284px' : '0';
}
addEventListener('resize', fit);
renderDemo(); reset();

</script>
</body>
