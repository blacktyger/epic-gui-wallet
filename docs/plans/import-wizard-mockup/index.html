/* ---------- mockup chrome ---------- */
const root = document.documentElement, scr = document.getElementById('screen'), tabs = document.getElementById('tabs'), note = document.getElementById('note');
let curId = 'm1', lastGroup = '';
Object.values(S).forEach(s => {
  if (s.group !== lastGroup) { tabs.insertAdjacentHTML('beforeend', `<div class="mk-grp" role="presentation"><small>${s.group}</small></div>`); lastGroup = s.group; }
  tabs.lastElementChild.insertAdjacentHTML('beforeend', `<button class="mk-tab" role="tab" data-s="${s.id}" aria-selected="false" title="${s.label}">${s.id} · ${s.label}</button>`);
});
function fit() {
  const f = scr.firstElementChild; if (!f) return;
  const W = parseInt(root.dataset.w), k = Math.min(1, (innerWidth - 32) / W);
  f.style.zoom = k; document.getElementById('hold').style.width = W * k + 'px';
}
function show(id) {
  if (!S[id]) id = 'm1'; curId = id; const s = S[id];
  scr.innerHTML = `<section class="frame" role="tabpanel" aria-label="${s.label}" id="frame">${s.html()}</section>`;
  note.innerHTML = `<b>${s.id}</b> · ${s.label} — ${s.note}`;
  tabs.querySelectorAll('.mk-tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.s === id)));
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  fit();
}
tabs.addEventListener('click', e => { const b = e.target.closest('.mk-tab'); if (b) show(b.dataset.s); });
document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
document.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => setW(b.dataset.w)));
function setTheme(t) { root.dataset.theme = t; document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t))); }
function setW(w) { root.dataset.w = w; document.querySelectorAll('button[data-w]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === w))); fit(); }
addEventListener('resize', fit);
const q = new URLSearchParams(location.search);
if (q.get('theme')) setTheme(q.get('theme')); if (q.get('w')) setW(q.get('w'));
show(q.get('s') || location.hash.slice(1) || 'm1');
addEventListener('hashchange', () => show(location.hash.slice(1)));
</script>
