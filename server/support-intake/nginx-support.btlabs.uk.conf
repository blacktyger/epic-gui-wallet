##
# support.btlabs.uk -- Epic GUI Wallet support intake (docs/SUPPORT.md in the GUI repo).
#
# POST /v1/report only (sealed report bundles, JSON, <= 3 MiB) -> 127.0.0.1:8795
# (systemd epic-support-intake.service, data in /srv/epic-support/reports). Everything else is a 404.
# No access log and only crit errors: no client IP is written by nginx for this name; the
# service's own abuse limiter keeps salted hashes in memory only.
#
# Certificate: /etc/letsencrypt/live/support.btlabs.uk (this name only), certbot --webroot via
# /var/www/certbot, renewed by certbot.timer like the other names here.
##

# per client: 6 requests a minute, queued (burst 3, no nodelay); 2 connections at once; 64 for the site
limit_req_zone  $binary_remote_addr zone=support_req:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=support_conn:1m;
limit_conn_zone $server_name        zone=support_site:1m;

server {
    listen 80;
    listen [::]:80;
    server_name support.btlabs.uk;
    access_log off;
    error_log /var/log/nginx/support.error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name support.btlabs.uk;

    ssl_certificate /etc/letsencrypt/live/support.btlabs.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.btlabs.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/support.error.log crit;
    server_tokens off;

    client_max_body_size 3m;
    client_body_buffer_size 256k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    reset_timedout_connection on;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 404;
    }

    location = /v1/report {
        limit_except POST { deny all; }
        limit_req zone=support_req burst=3;
        limit_conn support_conn 2;
        limit_conn support_site 64;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }

    location = /health {
        limit_except GET { deny all; }
        limit_req zone=support_req burst=3;
        proxy_pass http://127.0.0.1:8795/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}
